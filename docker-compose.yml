# Продакшен на сервере: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: english_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english_bot"]
      interval: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://english:${POSTGRES_PASSWORD}@postgres:5432/english_bot
      API_PORT: 8443
      TLS_CERT_PATH: /certs/fullchain.pem
      TLS_KEY_PATH: /certs/key.pem
    ports:
      - "8443:8443"   # API для Mini App (443 занят VPN)
    volumes:
      - ./certs:/certs:ro   # сертификат от acme.sh
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
